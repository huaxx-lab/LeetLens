<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="github.min.css">
  <link rel="stylesheet" href="katex.min.css">
  <link rel="stylesheet" href="code-block.css">
  <style>
    :root { --context-panel-inset: 0px; --conversation-inline-inset: max(24px, calc((100vw - var(--context-panel-inset) - 820px) / 2)); color-scheme: light dark; font: 15.5px/1.68 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    /* 滚动条由 WebViewPresentation 注入的悬浮 thumb 接管，这里不留任何原生滚动条样式 */
    /* 回到底部：圆形箭头，停在中轴底部，只做淡入淡出——位置固定，不跟着内容跳 */
    #jump-latest {
      /* body 底部留了 122px 给原生 composer，按钮要浮在它上面才看得见。 */
      position: fixed; left: 50%; bottom: 106px; z-index: 40;
      display: grid; place-items: center;
      width: 32px; height: 32px; padding: 0; border: 0; border-radius: 999px;
      color: CanvasText;
      background: color-mix(in srgb, Canvas 82%, transparent);
      -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7);
      box-shadow: 0 4px 16px rgba(0,0,0,.16), 0 0 0 .5px color-mix(in srgb, CanvasText 14%, transparent);
      cursor: pointer; opacity: 0; pointer-events: none;
      transform: translateX(-50%);
      transition: opacity .18s ease;
    }
    #jump-latest.is-visible { opacity: 1; pointer-events: auto; }
    #jump-latest:hover { background: color-mix(in srgb, Canvas 95%, transparent); }
    #jump-latest:active { background: color-mix(in srgb, CanvasText 8%, Canvas); }
    #jump-latest svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    /* 纯黑正文在白底上对比过强；88% 是 macOS 系统 UI 的观感。 */
    html, body { margin: 0; min-height: 100%; background: Canvas; color: color-mix(in srgb, CanvasText 88%, transparent); }
    /* 中轴列与原生 composer 同宽（AppDesign.Size.composerMaximum = 820），两者共用一根中轴 */
    body {
      padding: 46px calc(var(--conversation-inline-inset) + var(--context-panel-inset)) 122px var(--conversation-inline-inset);
      transition: padding-left 220ms ease-in-out, padding-right 220ms ease-in-out;
    }
    #messages { display: grid; gap: 26px; }
    .message { min-width: 0; animation: message-in 220ms cubic-bezier(.2,.75,.25,1) both; }
    .message.user { display: flex; flex-direction: column; align-items: flex-end; }
    .user-bubble { max-width: min(76%, 660px); padding: 10px 15px; border-radius: 18px; background: color-mix(in srgb, CanvasText 6.5%, Canvas); white-space: pre-wrap; overflow-wrap: anywhere; }
    .body { min-width: 0; overflow-wrap: anywhere; }
    .body > :first-child { margin-top: 0; }
    .body > :last-child { margin-bottom: 0; }
    /* 中文没有真正的 medium 字重，600 以上会直接跳到 Bold，看着又黑又粗；
       标题与强调统一压到 600，靠字号和颜色拉层级，不靠字重。 */
    h1, h2, h3, h4 { line-height: 1.32; letter-spacing: 0; margin: 1.1em 0 .5em; font-weight: 600; }
    strong { font-weight: 600; color: color-mix(in srgb, CanvasText 96%, transparent); }
    strong code, code strong { font-weight: 500; }
    h1 { font-size: 1.45rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.08rem; } h4 { font-size: 1rem; }
    /* 长回答里章节之间要能一眼分段：标题上方留白比下方大一倍，
       分隔线做淡，不要在正文中间拉出一道硬黑线。 */
    .body h2 { margin-top: 1.5em; padding-bottom: .3em; border-bottom: 1px solid color-mix(in srgb, CanvasText 8%, transparent); }
    .body h3 { margin-top: 1.35em; }
    .body hr { height: 1px; margin: 1.6em 0; border: 0; background: color-mix(in srgb, CanvasText 10%, transparent); }
    p, ul, ol, blockquote, table { margin: .72em 0; }
    /* 浏览器默认 40px 缩进对中文正文太深，正文会被整体推开。 */
    ul, ol { padding-left: 1.45em; }
    li { margin: 4px 0; }
    li::marker { color: color-mix(in srgb, CanvasText 45%, transparent); }
    a { color: #0a84ff; text-decoration: none; }
    blockquote { border-left: 3px solid #0a84ff; margin-left: 0; padding: 2px 0 2px 13px; color: color-mix(in srgb, CanvasText 67%, transparent); }
    /* 表格：表头压深、行间斑马纹、首列当行标题。对比列是最常见的用法
       （「这题 vs 那题」），不给表头和首列做区分的话整张表是一片均匀的字。 */
    .table-scroll { overflow: auto; border: 1px solid color-mix(in srgb, CanvasText 11%, transparent); border-radius: 10px; margin: 1em 0; }
    table { width: 100%; border-collapse: collapse; margin: 0; font-size: 13.5px; }
    th, td { padding: 10px 14px; border-bottom: 1px solid color-mix(in srgb, CanvasText 8%, transparent); text-align: left; vertical-align: top; }
    thead th { position: sticky; top: 0; z-index: 1; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, CanvasText 5%, Canvas); border-bottom-color: color-mix(in srgb, CanvasText 14%, transparent); }
    /* 首列多半是行标题（「条件」「你踩的坑」），压一档颜色但不加粗，避免和表头抢。 */
    tbody td:first-child { color: color-mix(in srgb, CanvasText 62%, transparent); white-space: nowrap; }
    tbody tr:nth-child(even) { background: color-mix(in srgb, CanvasText 2.5%, transparent); }
    tbody tr:hover { background: color-mix(in srgb, CanvasText 5%, transparent); }
    tr:last-child td { border-bottom: 0; }
    .visual-block { margin: 18px 0; border: 0; overflow: visible; background: transparent; }
    .visual-head { height: 40px; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 7px; color: color-mix(in srgb, CanvasText 50%, transparent); font-size: 12px; }
    .visual-head button { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: inherit; cursor: pointer; transition: background 160ms ease, color 160ms ease, transform 160ms cubic-bezier(.2,.8,.2,1); }
    .visual-head button + button { margin-left: 2px; }
    .visual-head button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .visual-head button:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
    .visual-head button:active { transform: scale(.94); }
    .visual-head .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff9f0a; }
    .mermaid-block .dot { background: #30d158; }
    .svg-canvas, .mermaid { min-height: 150px; padding: 0; display: grid; place-items: center; overflow: auto; }
    .streaming-svg-preview .svg-canvas:empty::before, .streaming-mermaid-preview .mermaid:empty::before { content: '正在绘制…'; color: color-mix(in srgb, CanvasText 42%, transparent); font-size: 12px; }
    .svg-canvas > svg, .mermaid > svg { display: block; width: 100%; max-width: 100%; height: auto; max-height: 620px; }
    .svg-source { display: none; }
    .body img { display: block; max-width: 100%; width: auto; height: auto; max-height: 460px; object-fit: contain; border-radius: 8px; cursor: zoom-in; background: color-mix(in srgb, CanvasText 4%, Canvas); }
    .body > p > img, .body > p > a:only-child > img { max-width: min(100%,760px); margin-inline: auto; }
    .inline-image-gallery { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; width: 100%; margin: 14px 0; align-items: stretch; }
    .inline-image-gallery.gallery-many { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .inline-image-gallery > p, .inline-image-gallery > figure, .inline-image-gallery > a { min-width: 0; margin: 0; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: color-mix(in srgb, CanvasText 3%, Canvas); }
    .inline-image-gallery img { width: 100%; height: 100%; min-height: 180px; max-height: 360px; aspect-ratio: 4/3; object-fit: contain; background: transparent; }
    @media (max-width: 820px) { .inline-image-gallery.gallery-many { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 520px) { .inline-image-gallery, .inline-image-gallery.gallery-many { grid-template-columns: 1fr; } }
    .artifact-gallery { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(240px,100%),1fr)); gap: 10px; width: 100%; margin: 14px 0 2px; }
    .message.user .artifact-gallery { width: min(78%,680px); }
    .artifact-gallery figure { margin: 0; min-width: 0; }
    .artifact-gallery img { display: block; width: 100%; max-height: 520px; object-fit: contain; border: 0; border-radius: 8px; background: transparent; cursor: zoom-in; }
    .artifact-gallery figcaption { margin-top: 5px; color: color-mix(in srgb,CanvasText 48%,transparent); font-size: 11px; overflow-wrap: anywhere; }
    .think-block { margin: 0 0 14px; border: 0; border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent); border-radius: 0; background: transparent; }
    .think-block > summary { display: flex; align-items: center; gap: 7px; padding: 7px 0 9px; font-size: 13px; font-weight: 500; color: color-mix(in srgb, CanvasText 55%, transparent); cursor: pointer; list-style: none; user-select: none; }
    .think-block > summary::-webkit-details-marker { display: none; }
    .think-block > summary::after { content: '›'; margin-left: auto; font-size: 13px; color: color-mix(in srgb, CanvasText 35%, transparent); transition: transform 160ms ease; }
    .think-block[open] > summary::after { transform: rotate(90deg); }
    .think-dot { display: none; }
    .think-body { padding: 1px 0 12px; font-size: 13px; line-height: 1.65; color: color-mix(in srgb, CanvasText 60%, transparent); }
    .think-body > :first-child { margin-top: 0; } .think-body > :last-child { margin-bottom: 0; }
    /* ReAct 工具卡片。每个工具一张，图标和主色按工具区分，
       内容布局由结果里的 layout 字段决定（list / timeline / metrics / checklist / video）。
       卡片默认收起，只露一行摘要；点开头部才展开——用户不想一进对话就被大段卡片淹没。 */
    .agent-card { border: 1px solid color-mix(in srgb, CanvasText 9%, transparent); border-radius: 13px; margin: 0 0 10px; overflow: hidden; background: color-mix(in srgb, CanvasText 2%, Canvas); box-shadow: 0 1px 2px color-mix(in srgb, CanvasText 4%, transparent); }
    .agent-card[open] { background: color-mix(in srgb, CanvasText 2.5%, transparent); }
    .agent-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none; transition: background .15s ease; }
    .agent-head:hover { background: color-mix(in srgb, var(--agent-tint, #6b7280) 8%, transparent); }
    .agent-head .glyph { width: 18px; height: 18px; display: grid; place-items: center; font-size: 10.5px; border-radius: 6px; color: #fff; background: var(--agent-tint, #6b7280); flex: none; }
    .agent-head .agent-summary { font-weight: 400; font-size: 12px; color: color-mix(in srgb, CanvasText 58%, transparent); margin-left: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-head .agent-caret { margin-left: auto; opacity: .45; transition: transform .15s ease; flex: none; }
    .agent-card[open] .agent-caret { transform: rotate(90deg); }
    .agent-card:not([open]) .agent-body { display: none; }
    .agent-body { padding: 2px 12px 12px; }
    /* 题解正文专属渲染区：跟列表条目区分开，像一篇嵌在对话里的小文章。
       不限高——正文在工具侧已截到 6000 字，再套一层滚动区会出现吞滚轮的嵌套滚动。 */
    .agent-article { margin-top: 4px; padding: 14px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 8%, transparent); background: Canvas; font-size: 13.5px; line-height: 1.72; }
    .agent-article > :first-child { margin-top: 0; }
    .agent-article > :last-child { margin-bottom: 0; }
    .agent-article h1, .agent-article h2, .agent-article h3, .agent-article h4 { margin: .9em 0 .4em; }
    /* 视频结果：缩略图在左、信息在右的横卡，整张卡可点，直接开 B 站。 */
    .agent-videos { display: grid; gap: 8px; margin-top: 4px; }
    .agent-video { display: grid; grid-template-columns: 122px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 8%, transparent); background: Canvas; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    .agent-video:hover { background: color-mix(in srgb, var(--agent-tint, #6b7280) 6%, Canvas); border-color: color-mix(in srgb, CanvasText 16%, transparent); }
    .agent-video-cover { width: 122px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 7px; background: color-mix(in srgb, CanvasText 8%, Canvas); align-self: start; display: block; }
    .agent-video-cover.is-placeholder { display: grid; place-items: center; color: color-mix(in srgb, CanvasText 35%, transparent); font-size: 18px; }
    .agent-video .agent-title { margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    /* 正文里裸露的长链接：换成一张可点的窄卡，替掉又长又难点的蓝色 URL。
       站点色只用在左侧色块和 hover 上，正文整体仍是中性配色。 */
    /* 卡片替换的是行内的 <a>，所以要显式转成块级，才能在 <p>/<li> 里独占一行。 */
    .inline-link-card { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; padding: 9px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 9%, transparent); background: color-mix(in srgb, CanvasText 2%, Canvas); cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    .inline-link-card:hover { background: color-mix(in srgb, var(--link-tint, #6b7280) 7%, Canvas); border-color: color-mix(in srgb, var(--link-tint, #6b7280) 30%, transparent); }
    .inline-link-glyph { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 7px; font-size: 11px; color: #fff; background: var(--link-tint, #6b7280); }
    .inline-link-body { display: flex; flex-direction: column; min-width: 0; }
    .inline-link-title { font-size: 13px; font-weight: 500; }
    .inline-link-sub { font-size: 11.5px; color: color-mix(in srgb, CanvasText 52%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inline-link-caret { margin-left: auto; opacity: .4; flex: none; }
    .agent-running { display: inline-flex; gap: 3px; }
    .agent-running i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .35; animation: agentPulse 1s infinite; }
    .agent-running i:nth-child(2) { animation-delay: .15s; }
    .agent-running i:nth-child(3) { animation-delay: .3s; }
    @keyframes agentPulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: .9; } }
    .agent-item { padding: 8px 0; border-top: 1px solid color-mix(in srgb, CanvasText 7%, transparent); }
    .agent-item:first-child { border-top: 0; }
    .agent-item .agent-title { font-size: 13px; font-weight: 500; }
    .agent-item .agent-sub { font-size: 11.5px; color: color-mix(in srgb, CanvasText 52%, transparent); margin-top: 1px; }
    .agent-item .agent-detail { font-size: 12.5px; line-height: 1.55; margin-top: 4px; color: color-mix(in srgb, CanvasText 78%, transparent); }
    .agent-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .agent-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, CanvasText 7%, transparent); color: color-mix(in srgb, CanvasText 62%, transparent); }
    .agent-badge.good { background: color-mix(in srgb, #34c759 16%, transparent); color: #1f7a37; }
    .agent-badge.warn { background: color-mix(in srgb, #ff9500 18%, transparent); color: #9a5b00; }
    .agent-jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .agent-jump { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); background: transparent; color: inherit; cursor: pointer; }
    .agent-jump:hover { background: color-mix(in srgb, CanvasText 7%, transparent); }
    .agent-metrics { display: flex; flex-wrap: wrap; gap: 14px; padding-top: 6px; }
    .agent-metric b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .agent-metric span { font-size: 11px; color: color-mix(in srgb, CanvasText 52%, transparent); }
    .agent-item .agent-index { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font-size: 10px; font-variant-numeric: tabular-nums; background: color-mix(in srgb, CanvasText 9%, transparent); margin-right: 6px; vertical-align: 1px; }
    .agent-item .agent-check { margin-right: 6px; opacity: .55; }
    .tool-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .tool-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; color: color-mix(in srgb, CanvasText 62%, transparent); background: color-mix(in srgb, CanvasText 6.5%, transparent); }
    .tool-chip svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .generation-state { display: flex; align-items: center; gap: 9px; min-height: 30px; margin-top: 8px; color: color-mix(in srgb, CanvasText 55%, transparent); font-size: 13px; }
    .generation-state.failed { color: #c63b32; }
    .generation-state button { min-height: 28px; padding: 0 10px; border: 0; border-radius: 7px; color: CanvasText; background: color-mix(in srgb, CanvasText 7%, Canvas); font: inherit; cursor: pointer; }
    .generation-state button:hover { background: color-mix(in srgb, CanvasText 11%, Canvas); }
    .typing { display: inline-flex; align-items: center; gap: 4px; height: 20px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: typing 1.15s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: 130ms; } .typing i:nth-child(3) { animation-delay: 260ms; }
    .lightbox { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-rows: 52px 1fr; background: color-mix(in srgb, #000 82%, transparent); backdrop-filter: blur(18px); opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lightbox-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 5px; padding: 0 12px; color: #fff; }
    .lightbox-toolbar output { margin-right: auto; font-size: 12px; color: rgba(255,255,255,.7); }
    .lightbox button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; color: #fff; background: rgba(255,255,255,.1); cursor: pointer; }
    .lightbox button:hover { background: rgba(255,255,255,.18); }
    .lightbox-stage { min-height: 0; display: grid; grid-template-columns: 52px 1fr 52px; place-items: center; overflow: hidden; }
    .lightbox-stage img { max-width: 88vw; max-height: calc(100vh - 78px); object-fit: contain; border-radius: 4px; cursor: grab; transform: scale(var(--image-zoom,1)); transition: transform 160ms ease; }
    .math-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    @keyframes message-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes typing { 0%,65%,100% { opacity: .28; transform: translateY(0); } 32% { opacity: 1; transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .message, .typing i { animation: none; } * { scroll-behavior: auto !important; } }
    @media (max-width: 720px) { :root { --conversation-inline-inset: 18px; } .user-bubble { max-width: 90%; } }
  </style>
</head>
<body>
  <main id="messages" aria-live="polite"></main>
  <button id="jump-latest" type="button" aria-label="回到最新消息" title="回到最新消息">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  </button>
  <aside class="lightbox" id="lightbox" aria-hidden="true">
    <header class="lightbox-toolbar"><output id="image-count"></output><button data-image-action="out" title="缩小">−</button><button data-image-action="in" title="放大">+</button><button data-image-action="close" title="关闭">×</button></header>
    <div class="lightbox-stage"><button data-image-action="previous" title="上一张">‹</button><img id="lightbox-image" alt=""><button data-image-action="next" title="下一张">›</button></div>
  </aside>
  <script src="purify.min.js"></script>
  <script src="markdown-it.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="code-block.js"></script>
  <script src="katex.min.js"></script>
  <script src="mermaid.min.js"></script>
  <script>
    const escapeHtml = window.CodeBlock.escapeHtml;
    const markdown = window.markdownit({ html:false, breaks:true, linkify:true, typographer:true, highlight(code, info) {
      return window.CodeBlock.highlight(code, window.CodeBlock.requestedLanguage(info));
    }});
    let renderingStreaming = false;
    /// 流式期间整条消息每 50ms 全量重渲染一次，已完结的代码块内容不再变化——
    /// 按 (语言, 源码) 记忆高亮结果，只有正在流入的那个块需要真正跑 hljs。
    const memo = (compute, limit) => {
      const cache = new Map();
      return key => {
        const hit = cache.get(key);
        if (hit !== undefined) return hit;
        const value = compute(key);
        if (cache.size >= limit) cache.clear();
        cache.set(key, value);
        return value;
      };
    };
    /// 分隔符必须是真的 NUL（一个字符）。写成 '\\u0000' 会得到 6 个字符的字面量 \u0000，
    /// 而下面按 `at + 1` 切分只跳过 1 个字符，无语言的代码块就被渲染成 "u0000<源码>"。
    const SEP = '\u0000';
    const highlightMemo = memo(key => {
      const at = key.indexOf(SEP);
      return markdown.options.highlight(key.slice(at + SEP.length), key.slice(0, at));

        title: '打开这篇力扣题解',

        renderedSigs.delete(previousID);
      }
      const sig=messageSignature(message);
      let article=host.querySelector(`.message[data-message-id="${CSS.escape(message.id)}"]`);
      if(article&&renderedSigs.get(message.id)===sig)return;
      if(article){ applyInner(article,message); }
      else { article=buildArticle(message); host.appendChild(article); }
      buildInlineImageGalleries(article);
      decorateInlineLinks(article);
      renderedSigs.set(message.id,sig);
      await mountVisuals(article);
      if(wasNearBottom)window.scrollTo({top:document.documentElement.scrollHeight,left:0,behavior:'instant'});
      scheduleViewportUpdate();
    };
    const removeConversationMessage = id => {
      document.querySelector(`.message[data-message-id="${CSS.escape(id)}"]`)?.remove();
      renderedSigs.delete(id);
    };
    const scrollToQuestion = id => document.querySelector(`.message.user[data-message-id="${CSS.escape(id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});
    let railFrame=0, lastRailID='', railUserIntentUntil=0;
    const markRailUserIntent=()=>{railUserIntentUntil=performance.now()+1100;};
    addEventListener('wheel',markRailUserIntent,{passive:true,capture:true});
    addEventListener('keydown',event=>{
      if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(event.key))markRailUserIntent();
    },{capture:true});
    const reportQuestionPosition=()=>{
      const nodes=[...document.querySelectorAll('.message.user[data-message-id]')]; if(!nodes.length)return;
      const targetY=innerHeight*.42;
      let closest=nodes[0], closestDistance=Infinity;
      for(const node of nodes){
        const top=node.getBoundingClientRect().top;
        const distance=Math.abs(top-targetY);
        if(distance<closestDistance){closest=node;closestDistance=distance;}
        else if(top>targetY)break;
      }
      const id=closest.dataset.messageId;
      const scrolling=performance.now()<railUserIntentUntil;
      if(id===lastRailID&&!scrolling)return;
      window.webkit?.messageHandlers?.questionRail?.postMessage({id,scrolling}); lastRailID=id;
    };
    /// 回到底部：离底超过一屏的 40% 才出现，避免刚滚一点就闪出来。
    const jumpButton=document.querySelector('#jump-latest');
    const distanceFromBottom=()=>{const doc=document.documentElement;return Math.max(0,doc.scrollHeight-window.innerHeight-(window.scrollY||doc.scrollTop||0));};
    const syncJumpButton=()=>{
      const gap=distanceFromBottom();
      const visible=jumpButton.classList.contains('is-visible');
      // 迟滞：出现要离底 260px，收起要回到 120px 以内，
      // 否则流式渲染时高度一直变，按钮会在阈值上反复闪。
      if(!visible&&gap>260)jumpButton.classList.add('is-visible');
      else if(visible&&gap<120)jumpButton.classList.remove('is-visible');
    };
    const scheduleViewportUpdate=()=>{
      if(railFrame)return;
      railFrame=requestAnimationFrame(()=>{railFrame=0;reportQuestionPosition();syncJumpButton();});
    };
    jumpButton.addEventListener('click',()=>{window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});});
    addEventListener('scroll',scheduleViewportUpdate,{passive:true});
    addEventListener('resize',scheduleViewportUpdate);
    new ResizeObserver(scheduleViewportUpdate).observe(document.querySelector('#messages'));
    syncJumpButton();
    let gallery=[],galleryIndex=0,galleryZoom=1;
    const showGalleryImage=()=>{const image=document.querySelector('#lightbox-image');if(!gallery.length)return;image.src=gallery[galleryIndex].currentSrc;image.alt=gallery[galleryIndex].alt||'图片预览';image.style.setProperty('--image-zoom',galleryZoom);document.querySelector('#image-count').textContent=`${galleryIndex+1} / ${gallery.length}`;};
    /// 复制 / 重试 / 看图统一走事件委托：流式期间不再每 50ms 重新绑定一遍全文档按钮。
    document.querySelector('#messages').addEventListener('click',event=>{
      const copy=event.target.closest('.copy');
      if(copy){
        const code=window.CodeBlock.codeFromButton(copy);
        if(code) window.webkit?.messageHandlers?.copyCode?.postMessage(code);
        window.CodeBlock.showCopied(copy);
        return;
      }
      if(event.target.closest('[data-conversation-action="retry"]')){
        window.webkit?.messageHandlers?.conversationAction?.postMessage('retry');
        return;
      }
      const jump=event.target.closest('[data-agent-jump]');
      if(jump){
        window.webkit?.messageHandlers?.agentJump?.postMessage({
          kind: jump.dataset.agentJump, id: jump.dataset.agentId || ''
        });
        return;
      }
      const toggle=event.target.closest('[data-agent-toggle]');
      if(toggle){
        const card=toggle.closest('.agent-card');
        if(card) card.toggleAttribute('open');
        return;
      }
      const image=event.target.closest('img');
      if(!image)return;
      gallery=[...document.querySelectorAll('#messages img')];
      galleryIndex=Math.max(0,gallery.indexOf(image));
      galleryZoom=1; showGalleryImage();
      const box=document.querySelector('#lightbox');
      box.classList.add('open'); box.setAttribute('aria-hidden','false');
    });
    document.querySelector('#lightbox').addEventListener('click',event=>{const action=event.target.closest('button')?.dataset.imageAction;if(!action)return;if(action==='close'){const box=document.querySelector('#lightbox');box.classList.remove('open');box.setAttribute('aria-hidden','true');return;}if(action==='previous')galleryIndex=(galleryIndex-1+gallery.length)%gallery.length;if(action==='next')galleryIndex=(galleryIndex+1)%gallery.length;if(action==='in')galleryZoom=Math.min(3,galleryZoom+.2);if(action==='out')galleryZoom=Math.max(.4,galleryZoom-.2);showGalleryImage();});
    addEventListener('keydown',event=>{if(event.key==='Escape'){document.querySelector('[data-image-action="close"]')?.click();}if(event.key==='ArrowLeft')document.querySelector('[data-image-action="previous"]')?.click();if(event.key==='ArrowRight')document.querySelector('[data-image-action="next"]')?.click();});
  </script>
</body>
</html>
