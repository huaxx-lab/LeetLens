<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    window.addEventListener('error', event => {
      const handler = window.webkit && window.webkit.messageHandlers.editorFailed;
      if (handler) handler.postMessage({ message: event.message || `本地资源加载失败：${event.filename || '未知脚本'}` });
    }, true);
  </script>
  <link rel="stylesheet" href="codemirror.css">
  <link rel="stylesheet" href="show-hint.css">
  <style>
    :root { color-scheme: light dark; }
    html, body, #editor { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .CodeMirror { width: 100%; height: 100%; background: transparent; color: CanvasText; font: 13px/1.58 ui-monospace,SFMono-Regular,Menlo,monospace; }
    /* 滚动条由注入的悬浮 thumb 接管 */
    .CodeMirror-scrollbar-filler, .CodeMirror-gutter-filler { display: none !important; }
    .CodeMirror-gutters { background: rgba(127,127,127,.04); background: color-mix(in srgb, CanvasText 3%, transparent); border-right: 1px solid rgba(127,127,127,.16); border-right-color: color-mix(in srgb, CanvasText 9%, transparent); }
    .CodeMirror-linenumber { color: #8a8a8a; color: color-mix(in srgb, CanvasText 38%, transparent); }
    .CodeMirror-cursor { border-left-color: CanvasText; }
    .CodeMirror-selected { background: rgba(10,122,255,.22) !important; background: color-mix(in srgb, Highlight 30%, transparent) !important; }
    .CodeMirror-activeline-background { background: rgba(127,127,127,.045); background: color-mix(in srgb, CanvasText 3.5%, transparent); }
    .cm-keyword { color: #a626a4; } .cm-def { color: #4078f2; } .cm-variable { color: CanvasText; }
    .cm-variable-2 { color: #986801; } .cm-variable-3, .cm-type { color: #0184bc; }
    .cm-number { color: #986801; } .cm-string, .cm-string-2 { color: #50a14f; }
    .cm-comment { color: #7f848e; font-style: italic; }
    .cm-operator { color: #383a42; }
    .cm-builtin { color: #c18401; } .cm-meta { color: #4078f2; }
    @media (prefers-color-scheme: dark) {
      .cm-keyword { color: #c678dd; } .cm-def { color: #61afef; } .cm-variable-2 { color: #e5c07b; }
      .cm-variable-3, .cm-type { color: #56b6c2; } .cm-number { color: #d19a66; }
      .cm-string, .cm-string-2 { color: #98c379; } .cm-comment { color: #7f848e; }
      .cm-operator { color: #abb2bf; } .cm-builtin { color: #e5c07b; } .cm-meta { color: #61afef; }
    }
    .diagnostic-gutter { width: 14px; }
    .diagnostic-marker { color: #e45649; font: 11px/1 -apple-system,sans-serif; cursor: default; }
    .diagnostic-line { background: color-mix(in srgb, #e45649 8%, transparent); }

    /* AI 就地标注：行首 ✦ + 淡色底 + 原文划掉，下面一块"虚的"替换代码，点接受才真正改。 */
    .ai-gutter { width: 14px; }
    .ai-gutter-marker { display: inline-block; width: 14px; text-align: center; font: 10px/1.58 -apple-system,sans-serif; color: #d97706; cursor: default; }
    .ai-gutter-marker.ai-error { color: #e45649; }
    .ai-gutter-marker.ai-hint { color: #0a84ff; }
    /* 要压过 CodeMirror 自己的 `.CodeMirror pre.CodeMirror-line { background: transparent }`。 */
    .CodeMirror pre.CodeMirror-line.ai-issue-line { background: color-mix(in srgb, #f59e0b 8%, transparent); }
    .CodeMirror pre.CodeMirror-line.ai-issue-line.ai-error { background: color-mix(in srgb, #e45649 8%, transparent); }
    .CodeMirror pre.CodeMirror-line.ai-issue-line.ai-hint { background: color-mix(in srgb, #0a84ff 6%, transparent); }
    .ai-removed { text-decoration: line-through; text-decoration-color: color-mix(in srgb, #e45649 55%, transparent); opacity: .6; }
    /* 左侧 2px 色条画在内边距里（inset 阴影），替换代码的左缘和编辑器正文的 4px 内边距对齐，
       虚影正好落在被划掉的原文正下方。 */
    .ai-fix { margin: 2px 16px 10px 0; padding: 7px 12px 8px 4px; border-radius: 0 8px 8px 0; background: color-mix(in srgb, CanvasText 3.5%, transparent); box-shadow: inset 2px 0 0 color-mix(in srgb, #0a84ff 60%, transparent); font: 12px/1.5 -apple-system,BlinkMacSystemFont,sans-serif; color: CanvasText; cursor: default; }
    .ai-fix.ai-error { box-shadow: inset 2px 0 0 color-mix(in srgb, #e45649 70%, transparent); }
    .ai-fix.ai-warning { box-shadow: inset 2px 0 0 color-mix(in srgb, #d97706 70%, transparent); }
    .ai-fix-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; padding-left: 8px; }
    .ai-fix-badge { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .3px; color: #0a84ff; }
    .ai-fix.ai-error .ai-fix-badge { color: #e45649; }
    .ai-fix.ai-warning .ai-fix-badge { color: #d97706; }
    .ai-fix-title { flex: none; font-weight: 600; }
    .ai-fix-why { min-width: 0; color: color-mix(in srgb, CanvasText 58%, transparent); overflow-wrap: anywhere; }
    /* "虚的"：和正文同字体同字号（逐列对齐），只把颜色压淡；不用斜体，斜体会让列看起来错位。 */
    .ai-fix-code { margin: 5px 0 7px; padding: 0; white-space: pre; overflow-x: auto; font: 13px/1.58 ui-monospace,SFMono-Regular,Menlo,monospace; color: color-mix(in srgb, CanvasText 42%, transparent); }
    .ai-fix-code.is-delete { padding-left: 8px; font: italic 12px/1.5 -apple-system,sans-serif; }
    .ai-fix-actions { display: flex; align-items: center; gap: 6px; padding-left: 8px; }
    .ai-fix-actions button { font: 500 11.5px/1 -apple-system,sans-serif; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .ai-fix-accept { color: #fff; background: #0a84ff; }
    .ai-fix-accept:hover { background: #0071e3; }
    .ai-fix-dismiss { color: CanvasText; background: color-mix(in srgb, CanvasText 8%, transparent); }
    .ai-fix-dismiss:hover { background: color-mix(in srgb, CanvasText 13%, transparent); }
    .ai-fix-keys { margin-left: 2px; font-size: 10.5px; color: color-mix(in srgb, CanvasText 42%, transparent); }

    /* 补全弹层：无轨道悬浮卡片，限高保证优先在光标下方展开 */
    .CodeMirror-hints {
      z-index: 10000 !important;
      width: min(278px, calc(100vw - 20px)) !important;
      min-width: min(224px, calc(100vw - 20px)) !important;
      max-width: min(328px, calc(100vw - 20px)) !important;
      max-height: min(224px, 36vh) !important;
      margin: 4px 0 0 !important;
      padding: 4px !important;
      overflow: auto !important;
      background: color-mix(in srgb, Canvas 94%, transparent) !important;
      border: 1px solid color-mix(in srgb, CanvasText 14%, transparent) !important;
      border-radius: 8px !important;
      box-shadow: 0 9px 24px rgba(18,28,34,.16), 0 1px 4px rgba(18,28,34,.10) !important;
      font: 12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace !important;
    }
    .CodeMirror-hint {
      display: flex !important;
      align-items: center;
      gap: 7px;
      padding: 3px 8px 3px 6px !important;
      border-radius: 5px;
      color: CanvasText !important;
      white-space: nowrap;
      overflow: hidden;
    }
    .CodeMirror-hint::before {
      flex: none;
      width: 15px; height: 15px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: 700 9px/1 -apple-system,sans-serif;
      color: #fff;
      background: #8a8a8e;
    }
    .CodeMirror-hint[data-completion-kind="method"]::before { content: "M"; background: #7a6cf5; }
    .CodeMirror-hint[data-completion-kind="type"]::before { content: "T"; background: #0a84d0; }
    .CodeMirror-hint[data-completion-kind="variable"]::before { content: "V"; background: #34a06a; }
    .CodeMirror-hint[data-completion-kind="keyword"]::before { content: "K"; background: #b057c8; }
    .CodeMirror-hint[data-completion-kind="property"]::before { content: "P"; background: #c07a2a; }
    .CodeMirror-hint[data-completion-kind="symbol"]::before { content: "S"; background: #8a8a8e; }
    .CodeMirror-hint-active {
      background: color-mix(in srgb, Highlight 22%, transparent) !important;
      color: CanvasText !important;
    }
    .code-completion-label { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
    .CodeMirror-hint small {
      margin-left: auto;
      padding-left: 10px;
      color: color-mix(in srgb, CanvasText 52%, transparent);
      font: 10.5px/1.3 -apple-system,sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .is-remote-completion .code-completion-label { font-weight: 500; }
  </style>
</head>

    const CODE_COMPLETIONS = {

        ['Math', '工具类'], ['TreeNode', '力扣节点'], ['ListNode', '力扣节点'], ['length', '属性'], ['size()', '方法'], ['add()', '方法'], ['get()', '方法'], ['set()', '方法'],

        ['def', '关键字'], ['class', '关键字'], ['return', '关键字'], ['if', '关键字'], ['elif', '关键字'], ['else', '关键字'],
        ['for', '关键字'], ['while', '关键字'], ['in', '关键字'], ['import', '关键字'], ['from', '关键字'], ['lambda', '关键字'],
        ['len()', '函数'], ['range()', '函数'], ['enumerate()', '函数'], ['zip()', '函数'], ['sorted()', '函数'], ['sum()', '函数'],
        ['min()', '函数'], ['max()', '函数'], ['abs()', '函数'], ['set()', '类型'], ['dict()', '类型'], ['list()', '类型'],
        ['defaultdict()', '类型'], ['Counter()', '类型'], ['deque()', '类型'], ['append()', '方法'], ['popleft()', '方法'], ['heappush()', '函数'],
        ['heappop()', '函数'], ['bisect_left()', '函数'], ['bisect_right()', '函数'], ['join()', '方法'], ['split()', '方法'], ['items()', '方法']
      ],
      cpp: [
        ['class', '关键字'], ['public', '关键字'], ['private', '关键字'], ['return', '关键字'], ['auto', '关键字'], ['const', '关键字'],
        ['if', '关键字'], ['else', '关键字'], ['for', '关键字'], ['while', '关键字'], ['int', '类型'], ['long long', '类型'],
        ['string', '类型'], ['vector', '类型'], ['unordered_map', '类型'], ['unordered_set', '类型'], ['queue', '类型'], ['deque', '类型'],
        ['stack', '类型'], ['priority_queue', '类型'], ['size()', '方法'], ['push_back()', '方法'], ['emplace_back()', '方法'], ['pop_back()', '方法'],
        ['find()', '方法'], ['count()', '方法'], ['insert()', '方法'], ['erase()', '方法'], ['sort()', '函数'], ['reverse()', '函数'],
        ['lower_bound()', '函数'], ['upper_bound()', '函数'], ['min()', '函数'], ['max()', '函数'], ['abs()', '函数'], ['accumulate()', '函数']
      ],
      javascript: [
        ['const', '关键字'], ['let', '关键字'], ['function', '关键字'], ['class', '关键字'], ['return', '关键字'], ['if', '关键字'],
        ['else', '关键字'], ['for', '关键字'], ['while', '关键字'], ['of', '关键字'], ['async', '关键字'], ['await', '关键字'],
        ['Array', '类型'], ['Object', '类型'], ['Map', '类型'], ['Set', '类型'], ['length', '属性'], ['push()', '方法'],
        ['pop()', '方法'], ['shift()', '方法'], ['unshift()', '方法'], ['slice()', '方法'], ['splice()', '方法'], ['includes()', '方法'],
        ['indexOf()', '方法'], ['map()', '方法'], ['filter()', '方法'], ['reduce()', '方法'], ['sort()', '方法'], ['forEach()', '方法'],
        ['Object.keys()', '函数'], ['Object.entries()', '函数'], ['Math.max()', '函数'], ['Math.min()', '函数'], ['Math.abs()', '函数']
      ],
      typescript: [
        ['interface', '关键字'], ['type', '关键字'], ['const', '关键字'], ['let', '关键字'], ['function', '关键字'], ['class', '关键字'],
        ['public', '关键字'], ['private', '关键字'], ['readonly', '关键字'], ['return', '关键字'], ['string', '类型'], ['number', '类型'],
        ['boolean', '类型'], ['Array', '类型'], ['Record', '类型'], ['Map', '类型'], ['Set', '类型'], ['length', '属性'],
        ['push()', '方法'], ['pop()', '方法'], ['slice()', '方法'], ['includes()', '方法'], ['map()', '方法'], ['filter()', '方法'],
        ['reduce()', '方法'], ['sort()', '方法'], ['Object.keys()', '函数'], ['Object.entries()', '函数'], ['Math.max()', '函数'], ['Math.min()', '函数']
      ]
    };
    const MEMBER_COMPLETIONS = {
      java: {
        arrays: ['sort()', 'parallelSort()', 'binarySearch()', 'fill()', 'copyOf()', 'copyOfRange()', 'equals()', 'deepEquals()', 'asList()', 'stream()', 'toString()', 'deepToString()', 'setAll()', 'parallelPrefix()'],
        collections: ['sort()', 'reverse()', 'binarySearch()', 'max()', 'min()', 'frequency()', 'swap()', 'fill()', 'shuffle()', 'unmodifiableList()'],
        math: ['max()', 'min()', 'abs()', 'ceil()', 'floor()', 'round()', 'sqrt()', 'pow()', 'log()', 'random()'],
        string: ['valueOf()', 'format()', 'join()', 'compareTo()', 'charAt()', 'substring()', 'split()', 'startsWith()', 'endsWith()', 'indexOf()', 'toCharArray()'],
        array: ['length', 'clone()'],
        list: ['size()', 'isEmpty()', 'add()', 'addAll()', 'get()', 'set()', 'remove()', 'contains()', 'indexOf()', 'subList()', 'sort()', 'stream()', 'clear()'],
        map: ['size()', 'isEmpty()', 'put()', 'putAll()', 'get()', 'getOrDefault()', 'containsKey()', 'containsValue()', 'computeIfAbsent()', 'keySet()', 'values()', 'entrySet()', 'remove()', 'clear()'],
        set: ['size()', 'isEmpty()', 'add()', 'addAll()', 'contains()', 'remove()', 'retainAll()', 'stream()', 'clear()'],
        deque: ['size()', 'isEmpty()', 'offer()', 'offerFirst()', 'offerLast()', 'peek()', 'peekFirst()', 'peekLast()', 'poll()', 'pollFirst()', 'pollLast()', 'push()', 'pop()', 'clear()'],
        '*': ['size()', 'isEmpty()', 'add()', 'get()', 'set()', 'put()', 'remove()', 'contains()', 'containsKey()', 'getOrDefault()', 'computeIfAbsent()', 'peek()', 'poll()', 'offer()', 'push()', 'pop()', 'clear()']
      },
      javascript: {
        math: ['max()', 'min()', 'abs()', 'ceil()', 'floor()', 'round()', 'sqrt()', 'pow()', 'random()'],
        object: ['keys()', 'values()', 'entries()', 'assign()', 'fromEntries()'],
        json: ['parse()', 'stringify()'],
        '*': ['push()', 'pop()', 'shift()', 'unshift()', 'slice()', 'splice()', 'includes()', 'indexOf()', 'map()', 'filter()', 'reduce()', 'sort()', 'forEach()', 'join()']
      },
      typescript: {
        math: ['max()', 'min()', 'abs()', 'ceil()', 'floor()', 'round()', 'sqrt()', 'pow()', 'random()'],
        object: ['keys()', 'values()', 'entries()', 'assign()', 'fromEntries()'],
        '*': ['push()', 'pop()', 'slice()', 'includes()', 'map()', 'filter()', 'reduce()', 'sort()', 'forEach()', 'join()']
      }
    };
    const JAVA_CONSTRUCTOR_COMPLETIONS = {
      list: [['ArrayList<>()', 'List 实现'], ['LinkedList<>()', 'List 实现']],
      set: [['HashSet<>()', 'Set 实现'], ['TreeSet<>()', '有序 Set']],
      map: [['HashMap<>()', 'Map 实现'], ['TreeMap<>()', '有序 Map']],
      deque: [['ArrayDeque<>()', 'Deque 实现'], ['LinkedList<>()', 'Deque 实现']],
      default: [
        ['ArrayList<>()', '集合'], ['HashMap<>()', '键值映射'], ['HashSet<>()', '集合'],
        ['ArrayDeque<>()', '双端队列'], ['PriorityQueue<>()', '优先队列'], ['StringBuilder()', '字符串构建器']
      ]
    };

    /// 泛型参数位置的候选。尖括号里只可能是类型，给关键字没有意义。
    const JAVA_TYPE_ARGUMENTS = [
      ['Integer', '包装类型'], ['String', '类型'], ['Character', '包装类型'], ['Long', '包装类型'],
      ['Double', '包装类型'], ['Boolean', '包装类型'], ['Object', '类型'],
      ['List<Integer>', '集合'], ['List<String>', '集合'], ['Map<Integer, Integer>', '映射'],
      ['Set<Integer>', '集合'], ['int[]', '数组'], ['TreeNode', '力扣节点'], ['ListNode', '力扣节点']
    ];

    let language = 'java';
    let changeTimer = 0;
    let diagnosticTimer = 0;
    let remoteTimer = 0;
    let completionGeneration = 0;
    let completionSnapshot = null;
    const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      lineNumbers: true,
      gutters: ['CodeMirror-linenumbers', 'diagnostic-gutter', 'ai-gutter'],
      mode: modes.java,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      smartIndent: true,
      electricChars: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      styleActiveLine: true,
      lineWrapping: false,
      extraKeys: {
        'Tab': cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection(' '.repeat(cm.getOption('indentUnit')), 'end', '+input'),
        'Shift-Tab': cm => cm.indentSelection('subtract'),
        'Cmd-[': cm => cm.indentSelection('subtract'),
        'Cmd-]': cm => cm.indentSelection('add'),
        'Backspace': cm => {
          if (cm.somethingSelected()) {
            cm.replaceSelection('', 'end', '+delete');
            return;
          }
          const cursor = cm.getCursor();
          const line = cm.getLine(cursor.line);
          const before = line.slice(0, cursor.ch);
          if (cursor.ch > 0 && /^\s+$/.test(before)) {
            const indentUnit = cm.getOption('indentUnit') || 4;
            const remainder = cursor.ch % indentUnit;
            const toDelete = remainder === 0 ? indentUnit : remainder;
            const from = { line: cursor.line, ch: cursor.ch - toDelete };
            cm.replaceRange('', from, cursor, '+delete');
          } else {
            cm.execCommand('delCharBefore');
          }
        },
        'Cmd-Space': complete,
        'Ctrl-Space': complete,
        // 光标停在 AI 标注的行上：⌥↩ 接受、Esc 忽略；不在就照常。
        'Alt-Enter': cm => acceptSuggestionAtCursor() ? undefined : CodeMirror.Pass,
        'Esc': cm => dismissSuggestionAtCursor() ? undefined : CodeMirror.Pass
      }
    });

    function post(name, payload) {
      const handler = window.webkit && window.webkit.messageHandlers[name];
      if (handler) handler.postMessage(payload);
    }

    function normalizedCompletionLanguage(value) {
      const lang = String(value || '').toLowerCase();
      if (lang === 'python3' || lang.startsWith('python')) return 'python';
      if (lang === 'c++' || lang.startsWith('cpp')) return 'cpp';
      if (lang === 'js' || lang.startsWith('javascript')) return 'javascript';
      if (lang === 'ts' || lang.startsWith('typescript')) return 'typescript';
      return lang;
    }

    function renderCodeCompletion(element, _data, completion) {
      const completionText = completion.displayText || completion.text;
      element.dataset.completionKind = completion.kind || (completionText.includes('(') ? 'method' : 'symbol');
      const label = document.createElement('span');
      label.className = 'code-completion-label';
      label.textContent = completionText;
      element.appendChild(label);
      if (!completion.detail) return;
      const detail = document.createElement('small');
      detail.textContent = completion.detail;
      element.appendChild(detail);
    }

    function completionKind(detail, text) {
      if (detail === '关键字') return 'keyword';
      if (detail === '类型') return 'type';
      if (detail === '局部变量' || detail === '方法参数' || detail === '当前文件') return 'variable';
      if (detail === '属性') return 'property';
      return String(text || '').includes('(') ? 'method' : 'symbol';
    }

    function remoteCompletionKind(kind) {
      const value = Number(kind);
      if ([2, 3, 4].includes(value)) return 'method';
      if (value === 5) return 'property';
      if ([6, 12, 13].includes(value)) return 'variable';
      if ([7, 8, 9, 22, 25].includes(value)) return 'type';
      if (value === 14) return 'keyword';
      return 'symbol';
    }

    function normalizedJavaType(type) {
      const source = String(type || '').replace(/\s+/g, '');
      const base = source.replace(/<.*>/, '').replace(/\[\]$/, '').split('.').pop().toLowerCase();
      if (source.endsWith('[]')) return 'array';
      if (['list', 'arraylist', 'linkedlist'].includes(base)) return 'list';
      if (['map', 'hashmap', 'treemap', 'linkedhashmap'].includes(base)) return 'map';
      if (['set', 'hashset', 'treeset', 'linkedhashset'].includes(base)) return 'set';
      if (['deque', 'queue', 'arraydeque', 'priorityqueue'].includes(base)) return 'deque';
      if (base === 'string' || base === 'stringbuilder') return 'string';
      return base;
    }

    function javaSymbolsBeforeCursor(cm, cursor) {
      const lines = cm.getValue().split('\n');
      const source = [...lines.slice(0, cursor.line), lines[cursor.line].slice(0, cursor.ch)].join('\n');
      const variables = new Map();
      const declaration = /\b([A-Za-z_$][\w$]*(?:\s*<[^;{}()=]+>)?(?:\s*\[\])*)\s+([A-Za-z_$][\w$]*)\s*(?=[=,;:)])/g;
      const primitives = new Set(['byte', 'short', 'int', 'long', 'float', 'double', 'boolean', 'char', 'var']);
      for (const match of source.matchAll(declaration)) {
        const rawType = match[1].trim();
        const baseType = rawType.replace(/<.*>/, '').replace(/\[\]$/, '').trim();
        if (!primitives.has(baseType) && !/^[A-Z]/.test(baseType)) continue;
        variables.set(match[2], { name: match[2], type: rawType, detail: match[0].trim().endsWith(')') ? '方法参数' : '局部变量' });
      }
      const methods = new Set();
      const methodPattern = /\b(?:public|protected|private|static|final|synchronized|abstract|native|\s)+[A-Za-z_$][\w$<>, ?\[\].]*\s+([A-Za-z_$][\w$]*)\s*\([^;{}]*\)\s*\{/g;
      for (const match of source.matchAll(methodPattern)) methods.add(match[1]);
      return { source, variables, methods };
    }

    function javaConstructorCompletions(lineBeforeCursor, prefix) {
      const assignment = lineBeforeCursor.match(/([A-Za-z_$][\w$]*(?:\s*<[^>]+>)?(?:\s*\[\])?)\s+[A-Za-z_$][\w$]*\s*=\s*new\s+(?:[A-Za-z_$][\w$]*)?$/);
      const expectedType = normalizedJavaType(assignment && assignment[1]);
      const definitions = JAVA_CONSTRUCTOR_COMPLETIONS[expectedType] || JAVA_CONSTRUCTOR_COMPLETIONS.default;
      return definitions
        .filter(([text]) => !prefix || text.toLowerCase().startsWith(prefix))
        .map(([text, detail]) => ({ text, displayText: text, detail, kind: 'type', render: renderCodeCompletion }));
    }

    /// 把字符串、字符字面量和行注释涂成下划线，长度不变。
    /// 不涂的话 `String s = "a<b"` 会被当成泛型没闭合。
    function maskLiterals(text) {
      return text
        .replace(/\\./g, '__')
        .replace(/"[^"]*"?/g, match => '_'.repeat(match.length))
        .replace(/'[^']*'?/g, match => '_'.repeat(match.length))
        .replace(/\/\/.*$/, match => '_'.repeat(match.length));
    }

    /// 光标是不是停在 Java 泛型参数里（`Map<String, I|`）。是就返回已输入的前缀，不是返回 null。
    ///
    /// `<` 前面必须是**大写开头的标识符**才算泛型开口，否则 `if (i < n` 也会被当成泛型；
    /// 不算数的开口照样入栈（记 -1），这样 `a < b && c > d` 能正常配平。
    /// `->` 里的 `>` 是 lambda 箭头，不是闭合。
    function javaGenericArgumentPrefix(lineBeforeCursor, normalizedLanguage) {
      if (normalizedLanguage !== 'java') return null;
      const source = maskLiterals(lineBeforeCursor);
      const openings = [];
      for (let i = 0; i < source.length; i++) {
        const ch = source[i];
        if (ch === '<') {
          const owner = source.slice(0, i).match(/[A-Za-z_$][\w$]*$/)?.[0] || '';
          openings.push(/^[A-Z]/.test(owner) ? i : -1);
        } else if (ch === '>') {
          if (source[i - 1] === '-') continue;
          openings.pop();
        }
      }
      if (!openings.length || openings[openings.length - 1] < 0) return null;
      return lineBeforeCursor.match(/[\w$]*$/)?.[0] ?? '';
    }

    function codeCompletionHint(cm, hintLanguage) {
      const cursor = cm.getCursor();
      const line = cm.getLine(cursor.line);
      const lineBeforeCursor = line.slice(0, cursor.ch);
      const memberMatch = lineBeforeCursor.match(/([A-Za-z_$][\w$]*)\.([\w$]*)$/);
      const normalizedLanguage = normalizedCompletionLanguage(hintLanguage);
      if (memberMatch) {
        const ownerName = memberMatch[1];
        let owner = ownerName.toLowerCase();
        const memberPrefix = memberMatch[2].toLowerCase();
        const languageMembers = MEMBER_COMPLETIONS[normalizedLanguage] || {};
        let detail = ownerName;
        if (normalizedLanguage === 'java') {
          const symbol = javaSymbolsBeforeCursor(cm, cursor).variables.get(ownerName);
          if (symbol) {
            owner = normalizedJavaType(symbol.type);
            detail = symbol.type.replace(/\s+/g, ' ');
          }
        }
        const members = [...new Set(languageMembers[owner] || languageMembers['*'] || [])]
          .filter(text => !memberPrefix || text.toLowerCase().startsWith(memberPrefix))
          .map(text => ({ text, displayText: text, detail: text.includes('(') ? detail : '属性', kind: text.includes('(') ? 'method' : 'property', render: renderCodeCompletion }));
        return { list: members, from: CodeMirror.Pos(cursor.line, cursor.ch - memberMatch[2].length), to: cursor };
      }
      const constructorMatch = normalizedLanguage === 'java' && lineBeforeCursor.match(/\bnew\s+([A-Za-z_$][\w$]*)?$/);
      if (constructorMatch) {
        const prefix = String(constructorMatch[1] || '').toLowerCase();
        return {
          list: javaConstructorCompletions(lineBeforeCursor, prefix),
          from: CodeMirror.Pos(cursor.line, cursor.ch - prefix.length),
          to: cursor
        };
      }
      const genericPrefix = javaGenericArgumentPrefix(lineBeforeCursor, normalizedLanguage);
      if (genericPrefix !== null) {
        const needle = genericPrefix.toLowerCase();
        const words = CodeMirror.hint.anyword(cm, { word: /[\w$]+/, range: 500 }).list || [];
        // 文件里出现过的大写标识符多半是类名（自定义的 Node、Pair 这些）。
        const classNames = words
          .map(item => (typeof item === 'string' ? item : (item && item.text)) || '')
          .filter(text => /^[A-Z][\w$]*$/.test(text))
          .map(text => [text, '当前文件']);
        const seen = new Set();
        const list = [];
        for (const [text, detail] of [...JAVA_TYPE_ARGUMENTS, ...classNames]) {
          if (seen.has(text) || !text.toLowerCase().startsWith(needle)) continue;
          seen.add(text);
          list.push({ text, displayText: text, detail, kind: 'type', render: renderCodeCompletion, hint: applyCompletion });
        }
        return { list, from: CodeMirror.Pos(cursor.line, cursor.ch - genericPrefix.length), to: cursor };
      }
      let start = cursor.ch;
      while (start && /[\w$+#-]/.test(line.charAt(start - 1))) start -= 1;
      const prefix = line.slice(start, cursor.ch).toLowerCase();
      const definitions = CODE_COMPLETIONS[normalizedLanguage] || [];
      const builtIns = definitions
        .filter(([text]) => !prefix || text.toLowerCase().startsWith(prefix))
        .map(([text, detail]) => ({ text, displayText: text, detail, kind: completionKind(detail, text), render: renderCodeCompletion }));
      const anyword = CodeMirror.hint.anyword(cm, { word: /[\w$]+/, range: 500 });
      const scoped = [];
      if (normalizedLanguage === 'java') {
        const symbols = javaSymbolsBeforeCursor(cm, cursor);
        for (const symbol of symbols.variables.values()) {
          if (!prefix || symbol.name.toLowerCase().startsWith(prefix)) {
            scoped.push({ text: symbol.name, displayText: symbol.name, detail: symbol.type, kind: 'variable', render: renderCodeCompletion });
          }
        }
        for (const method of symbols.methods) {
          const text = `${method}()`;
          if (!prefix || method.toLowerCase().startsWith(prefix)) {
            scoped.push({ text, displayText: text, detail: '当前类', kind: 'method', render: renderCodeCompletion });
          }
        }
      }
      const seen = new Set();
      const list = [...scoped, ...(anyword.list || []).map(item => typeof item === 'string'
        ? { text: item, displayText: item, detail: '当前文件', kind: 'variable', render: renderCodeCompletion }
        : item), ...builtIns].filter(item => {
        const text = item && item.text;
        if (!text || seen.has(text) || (prefix && !text.toLowerCase().startsWith(prefix))) return false;
        seen.add(text);
        return true;
      });
      return { ...anyword, list, from: CodeMirror.Pos(cursor.line, start), to: cursor };
    }

    function remoteCompletionText(item) {
      return String(item.insertText || item.text || item.label || '')
        .replace(/\$\{\d+:([^}]*)\}/g, '$1')
        .replace(/\$\{\d+\}/g, '')
        .replace(/\$\d+/g, '');
    }

    /// 一对括号里那段内容的范围（要选中的部分）。空括号返回 null——里面没东西可选。
    /// 按深度配对，不用正则：`max(a, min(b, c))` 的外层右括号在最后。
    function bracketSpan(text, open, close) {
      const start = text.indexOf(open);
      if (start < 0) return null;
      let depth = 0;
      for (let i = start; i < text.length; i++) {
        if (text[i] === open) depth++;
        else if (text[i] === close) {
          depth--;
          if (depth === 0) return i > start + 1 ? { from: start + 1, to: i } : null;
        }
      }
      // JDT 偶尔给半截（`sort(int[] a`）：有内容就选到末尾。
      return text.length > start + 1 ? { from: start + 1, to: text.length } : null;
    }

    /// 不接参数的方法。补全后光标留在末尾更顺手，收进空括号反而要多按一下右方向键。
    const NO_ARGUMENT_METHODS = new Set([
      'size', 'length', 'isEmpty', 'toCharArray', 'reverse', 'clear', 'iterator', 'hashCode', 'toString',
      'trim', 'toLowerCase', 'toUpperCase', 'keySet', 'values', 'entrySet', 'getKey', 'getValue',
      'pop', 'poll', 'peek', 'pollFirst', 'pollLast', 'peekFirst', 'peekLast', 'removeFirst', 'removeLast',
      'next', 'hasNext', 'popleft', 'items', 'keys', 'begin', 'end', 'top', 'front', 'back', 'empty', 'pop_back'
    ]);

    /// `(` 之前那个标识符（先剥掉泛型）：`Arrays.sort(` → `sort`，`ArrayList<>(` → `ArrayList`。
    function calleeName(text, open) {
      return text.slice(0, open).replace(/<[^<>]*>\s*$/, '').match(/[\w$]+$/)?.[0] || '';
    }

    /// 接受候选后光标落在哪。只有**真的有东西要填**才把光标收进去：
    ///   sort(int[] a)              → 整段选中 `int[] a`，打字直接覆盖
    ///   Map<K, V>                  → 整段选中 `K, V`
    ///   add() / Arrays.sort()      → 光标进空括号：这些方法还得填参数
    ///   new ArrayList<>() / size() → 不动，光标停在末尾，接着写 `;` 就行
    function placeholderSpan(text) {
      const filled = bracketSpan(text, '(', ')') || bracketSpan(text, '<', '>');
      if (filled) return filled;
      const open = text.indexOf('(');
      if (open < 0 || text[open + 1] !== ')') return null;
      const name = calleeName(text, open);
      // 大写开头 = 构造器或类型（`new ArrayList<>()`、`StringBuilder()`），补完就该往下写。
      if (!name || /^[A-Z]/.test(name) || NO_ARGUMENT_METHODS.has(name)) return null;
      return { from: open + 1, to: open + 1 };
    }

    function applyCompletion(cm, data, completion) {
      const text = String(completion.text || '');
      cm.replaceRange(text, data.from, data.to, 'complete');
      if (text.includes('\n')) return;
      const span = placeholderSpan(text);
      if (!span) return;
      const line = data.from.line;
      const from = { line, ch: data.from.ch + span.from };
      if (span.to > span.from) cm.setSelection(from, { line, ch: data.from.ch + span.to });
      else cm.setCursor(from);
    }

    function mergeRemoteCompletions(local, remoteItems) {
      const seen = new Set();
      const list = [];
      for (const item of (local && local.list) || []) {
        const text = typeof item === 'string' ? item : item && item.text;
        if (!text || seen.has(text)) continue;
        seen.add(text);
        // 本地候选多半是裸标识符；万一带括号（片段模板），也走同一套光标处理。
        list.push(text.includes('(') && typeof item !== 'string' ? { ...item, hint: applyCompletion } : item);
      }
      for (const item of Array.isArray(remoteItems) ? remoteItems : []) {
        const text = remoteCompletionText(item);
        if (!text || seen.has(text)) continue;
        seen.add(text);
        list.push({
          text,
          displayText: String(item.label || text),
          detail: String(item.detail || 'Java 语义'),
          kind: remoteCompletionKind(item.kind),
          render: renderCodeCompletion,
          className: 'is-remote-completion',
          hint: applyCompletion
        });
      }
      return { ...local, list };
    }

    function showCompletion(cm, remoteItems = []) {
      cm.showHint({
        hint: instance => mergeRemoteCompletions(codeCompletionHint(instance, language), remoteItems),
        extraKeys: {
          Enter: (instance, handle) => {
            const before = instance.getValue();
            const cursorBefore = instance.getCursor();
            handle.pick();
            // show-hint normally consumes Enter even for an identical candidate.
            // 但"文本没变"也可能是我们把光标挪进了括号（`size()` 这种），
            // 那一下不能再补换行，否则换行会插到括号中间。
            const cursorAfter = instance.getCursor();
            const moved = cursorAfter.line !== cursorBefore.line || cursorAfter.ch !== cursorBefore.ch;
            if (instance.getValue() === before && !moved && !instance.somethingSelected()) {
              instance.execCommand('newlineAndIndent');
            }
          }
        },
        completeSingle: false,
        closeOnUnfocus: true,
        alignWithWord: true,
        container: document.body
      });
    }

    function complete(cm) {
      completionGeneration += 1;
      clearTimeout(remoteTimer);
      showCompletion(cm);
      if (language !== 'java') return;
      const cursor = cm.getCursor();
      const code = cm.getValue();
      const requestID = completionGeneration;
      completionSnapshot = { requestID, code, line: cursor.line, character: cursor.ch };
      remoteTimer = setTimeout(() => {
        post('remoteCompletionRequested', { requestID, code, line: cursor.line, character: cursor.ch, language });
      }, 70);
    }

    function scanDiagnostics(source) {
      const issues = [];
      const stack = [];
      const pairs = { ')': '(', ']': '[', '}': '{' };
      const lines = source.split('\n');
      let quote = '', quoteLine = 0, escaped = false, blockComment = false;
      lines.forEach((line, lineIndex) => {
        let lineComment = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i], next = line[i + 1];
          if (lineComment) break;
          if (blockComment) { if (ch === '*' && next === '/') { blockComment = false; i++; } continue; }
          if (quote) {
            if (escaped) { escaped = false; continue; }
            if (ch === '\\') { escaped = true; continue; }
            if (ch === quote) { quote = ''; continue; }
            continue;
          }
          if (ch === '/' && next === '/') { lineComment = true; break; }
          if (ch === '/' && next === '*') { blockComment = true; i++; continue; }
          if (ch === '"' || ch === "'") { quote = ch; quoteLine = lineIndex; continue; }
          if ('([{'.includes(ch)) stack.push({ ch, line: lineIndex });
          else if (pairs[ch]) {
            const open = stack.pop();
            if (!open || open.ch !== pairs[ch]) issues.push({ line: lineIndex, message: `括号 ${ch} 没有匹配的开始符号` });
          }
        }
        if (quote && language !== 'python' && language !== 'python3') {
          issues.push({ line: quoteLine, message: '字符串未在本行闭合' }); quote = ''; escaped = false;
        }
      });
      if (blockComment) issues.push({ line: Math.max(0, lines.length - 1), message: '块注释未闭合' });
      if (quote) issues.push({ line: quoteLine, message: '字符串未闭合' });
      stack.forEach(open => issues.push({ line: open.line, message: `括号 ${open.ch} 未闭合` }));
      return issues.slice(0, 24);
    }

    function updateDiagnostics() {
      editor.clearGutter('diagnostic-gutter');
      // 回调必须没有返回值：CodeMirror 的 eachLine 遇到回调返回真值就停止遍历，
      // 而 removeLineClass 删成功时返回行句柄（真值）——写成箭头表达式时只清掉第一条红行，
      // 后面的红行永远留着（两处以上括号错误、修好之后仍有一行发红）。
      editor.eachLine(handle => { editor.removeLineClass(handle, 'background', 'diagnostic-line'); });
      const issues = scanDiagnostics(editor.getValue());
      const seen = new Set();
      issues.forEach(issue => {
        if (seen.has(issue.line)) return; seen.add(issue.line);
        const marker = document.createElement('span'); marker.className = 'diagnostic-marker'; marker.textContent = '●'; marker.title = issue.message;
        editor.setGutterMarker(issue.line, 'diagnostic-gutter', marker);
        editor.addLineClass(issue.line, 'background', 'diagnostic-line');
      });
      post('editorDiagnostics', { issues });
    }

    // 宿主要按内容高度自适应外框，否则写死的高度会把代码结尾裁掉。
    const contentHeight = () => Math.ceil(editor.getScrollInfo().height);

    // 文档身份（题 + 语言）。每条回报都带上：换篇的瞬间旧文档可能还有一条消息在路上，
    // 宿主据此丢掉，否则上一种语言的代码会被写进这一种语言的草稿。
    let documentID = '';
    let selectionTimer = null;

    // ---------- AI 就地标注 ----------
    //
    // 每条建议记住它占的行句柄：CodeMirror 的行句柄会跟着插入删除自动挪位，
    // 行被删掉时 getLineNumber 返回 null。接受时按句柄现在的位置替换，所以用户在
    // 上面加了几行也不会改错地方；这几行本身被改过（和原文对不上）就作废。
    let suggestionEntries = [];
    let staleTimer = 0;
    const squash = value => String(value || '').replace(/\s+/g, '');

    function locateSuggestion(s) {
      const target = String(s.original || '').split('\n').map(squash);
      const total = editor.lineCount(), count = target.length;
      if (!count || count > total) return -1;
      const at = start => {
        if (start < 0 || start + count > total) return false;
        for (let i = 0; i < count; i++) if (squash(editor.getLine(start + i)) !== target[i]) return false;
        return true;
      };
      const anchor = Math.min(Math.max((s.startLine || 1) - 1, 0), total - 1);
      if (at(anchor)) return anchor;
      for (let d = 1; d <= 8; d++) { if (at(anchor - d)) return anchor - d; if (at(anchor + d)) return anchor + d; }
      return -1;
    }

    function entryRange(entry) {
      const from = editor.getLineNumber(entry.handles[0]);
      const to = editor.getLineNumber(entry.handles[entry.handles.length - 1]);
      return from == null || to == null ? null : { from, to };
    }

    function entryIntact(entry) {
      const range = entryRange(entry);
      if (!range) return false;
      const lines = [];
      for (let l = range.from; l <= range.to; l++) lines.push(editor.getLine(l));
      return squash(lines.join('\n')) === squash(entry.s.original);
    }

    function clearEntry(entry) {
      entry.marks.forEach(mark => mark.clear());
      if (entry.widget) entry.widget.clear();
      // 用 text 层而不是 background 层：background 会连同挂在这一行下面的建议块一起染色。
      entry.handles.forEach(handle => { editor.removeLineClass(handle, 'text', 'ai-issue-line'); editor.removeLineClass(handle, 'text', 'ai-' + entry.s.severity); });
      if (editor.getLineNumber(entry.handles[0]) != null) editor.setGutterMarker(entry.handles[0], 'ai-gutter', null);
    }

    function resolveEntry(entry, action) {
      clearEntry(entry);
      suggestionEntries = suggestionEntries.filter(item => item !== entry);
      post('suggestionResolved', { id: entry.s.id, action, documentID });
    }

    function renderSuggestion(s) {
      const from = locateSuggestion(s);
      if (from < 0) return null;
      const to = from + String(s.original).split('\n').length - 1;
      const severity = ['error', 'warning', 'hint'].includes(s.severity) ? s.severity : 'warning';
      const entry = { s: { ...s, severity }, marks: [], widget: null, handles: [] };
      for (let l = from; l <= to; l++) {
        const handle = editor.getLineHandle(l);
        editor.addLineClass(handle, 'text', 'ai-issue-line ai-' + severity);
        entry.handles.push(handle);
      }
      const firstText = editor.getLine(from).search(/\S/);
      entry.marks.push(editor.markText({ line: from, ch: Math.max(0, firstText) }, { line: to, ch: editor.getLine(to).length }, { className: 'ai-removed' }));

      const marker = document.createElement('span');
      marker.className = 'ai-gutter-marker ai-' + severity;
      marker.textContent = '✦';
      marker.title = s.title || 'AI 建议';
      editor.setGutterMarker(entry.handles[0], 'ai-gutter', marker);

      const node = document.createElement('div');
      node.className = 'ai-fix ai-' + severity;
      const head = document.createElement('div'); head.className = 'ai-fix-head';
      const badge = document.createElement('span'); badge.className = 'ai-fix-badge'; badge.textContent = 'AI';
      const title = document.createElement('span'); title.className = 'ai-fix-title'; title.textContent = s.title || '建议修改';
      const why = document.createElement('span'); why.className = 'ai-fix-why'; why.textContent = s.explanation || '';
      head.append(badge, title, why);
      const code = document.createElement('pre');
      if (s.replacement) { code.className = 'ai-fix-code'; code.textContent = s.replacement; }
      else { code.className = 'ai-fix-code is-delete'; code.textContent = '删除这几行'; }
      const actions = document.createElement('div'); actions.className = 'ai-fix-actions';
      const accept = document.createElement('button'); accept.className = 'ai-fix-accept'; accept.textContent = '接受';
      const dismiss = document.createElement('button'); dismiss.className = 'ai-fix-dismiss'; dismiss.textContent = '忽略';
      const keys = document.createElement('span'); keys.className = 'ai-fix-keys'; keys.textContent = '⌥↩ 接受 · Esc 忽略';
      accept.addEventListener('mousedown', event => { event.preventDefault(); event.stopPropagation(); acceptEntry(entry); });
      dismiss.addEventListener('mousedown', event => { event.preventDefault(); event.stopPropagation(); resolveEntry(entry, 'dismissed'); editor.focus(); });
      actions.append(accept, dismiss, keys);
      node.append(head, code, actions);
      entry.widget = editor.addLineWidget(to, node, { handleMouseEvents: true });
      return entry;
    }

    function acceptEntry(entry, focus = true) {
      if (!entryIntact(entry)) { resolveEntry(entry, 'stale'); return false; }
      const range = entryRange(entry);
      let from = { line: range.from, ch: 0 };
      let to = { line: range.to, ch: editor.getLine(range.to).length };
      const replacement = entry.s.replacement || '';
      if (!replacement) {
        // 删除整行：连换行一起删，不留空行。
        if (range.to + 1 < editor.lineCount()) to = { line: range.to + 1, ch: 0 };
        else if (range.from > 0) from = { line: range.from - 1, ch: editor.getLine(range.from - 1).length };
      }
      clearEntry(entry);
      suggestionEntries = suggestionEntries.filter(item => item !== entry);
      editor.operation(() => editor.replaceRange(replacement, from, to, '+aiFix'));
      post('suggestionResolved', { id: entry.s.id, action: 'accepted', documentID });
      if (focus) {
        const last = range.from + Math.max(0, replacement.split('\n').length - 1);
        editor.setCursor({ line: Math.min(last, editor.lineCount() - 1), ch: editor.getLine(Math.min(last, editor.lineCount() - 1)).length });
        editor.focus();
      }
      return true;
    }

    function entryAtCursor() {
      const line = editor.getCursor().line;
      return suggestionEntries.find(entry => { const range = entryRange(entry); return range && line >= range.from && line <= range.to; });
    }
    function acceptSuggestionAtCursor() { const entry = entryAtCursor(); return entry ? acceptEntry(entry) : false; }
    function dismissSuggestionAtCursor() { const entry = entryAtCursor(); if (!entry) return false; resolveEntry(entry, 'dismissed'); return true; }

    function setSuggestions(list) {
      suggestionEntries.forEach(clearEntry);
      suggestionEntries = [];
      (Array.isArray(list) ? list : []).forEach(s => {
        const entry = renderSuggestion(s);
        if (entry) suggestionEntries.push(entry);
        else post('suggestionResolved', { id: s.id, action: 'stale', documentID });
      });
    }

    function acceptAllSuggestions() {
      // 从下往上接受：上面的行数变化不会影响下面还没接受的位置判断（其实句柄会自动挪，这里只是更稳）。
      const ordered = suggestionEntries.slice().sort((a, b) => (entryRange(b)?.from ?? 0) - (entryRange(a)?.from ?? 0));
      editor.operation(() => ordered.forEach(entry => acceptEntry(entry, false)));
      editor.focus();
    }

    editor.on('change', (_, change) => {
      if (change.origin === '+aiFix' || change.origin === 'setValue' || !suggestionEntries.length) return;
      clearTimeout(staleTimer);
      staleTimer = setTimeout(() => {
        suggestionEntries.slice().forEach(entry => { if (!entryIntact(entry)) resolveEntry(entry, 'stale'); });
      }, 250);
    });

    editor.on('change', () => {
      clearTimeout(changeTimer); clearTimeout(diagnosticTimer);
      changeTimer = setTimeout(() => post('editorChanged', { code: editor.getValue(), contentHeight: contentHeight(), documentID }), 40);
      diagnosticTimer = setTimeout(updateDiagnostics, 160);
    });

    // 选中的代码报给宿主，问 AI 时作为"我说的是这几行"附带过去。
    editor.on('cursorActivity', () => {
      clearTimeout(selectionTimer);
      selectionTimer = setTimeout(() => {
        const text = editor.getSelection();
        if (!text) { post('editorSelection', { documentID, text: '' }); return; }
        const from = editor.getCursor('from'), to = editor.getCursor('to');
        // 选区停在下一行行首时，那一行其实没选中。
        const toLine = to.ch === 0 && to.line > from.line ? to.line - 1 : to.line;
        post('editorSelection', { documentID, text: text.slice(0, 4000), fromLine: from.line + 1, toLine: toLine + 1 });
      }, 150);
    });

    editor.on('inputRead', (cm, change) => {
      const inserted = (change.text || []).join('\n');
      const cursor = cm.getCursor();
      const before = cm.getLine(cursor.line).slice(0, cursor.ch);
      const prefix = before.match(/[\w$]+$/)?.[0] || '';
      const constructorContext = language === 'java' && /\bnew\s+(?:[A-Za-z_$][\w$]*)?$/.test(before);
      if (/[\w$.]$/.test(inserted) && (prefix.length >= 1 || before.endsWith('.'))) complete(cm);
      else if (/\s$/.test(inserted) && constructorContext) complete(cm);
      // `Map<` 刚敲下尖括号时还没有任何前缀，但这一刻正是最该给类型候选的时候。
      else if (inserted === '<' && javaGenericArgumentPrefix(before, normalizedCompletionLanguage(language)) !== null) complete(cm);
      else { completionGeneration += 1; clearTimeout(remoteTimer); }
    });

    editor.on('keydown', (cm, event) => {
      if (event.isComposing || event.keyCode === 229) {
        cm.closeHint();
        // Let the browser/IME commit its composition, without a completion pick.
        event.codemirrorIgnore = true;
      }
    });

    window.editorBridge = {
      // 换题 / 换语言：整篇载入并清空撤销历史。
      // CodeMirror 的 setValue 本身是可撤销的——不清历史，换题后 ⌘Z 会把上一题的代码撤回来。
      load(value, lang, id) {
        setSuggestions([]);
        documentID = id || '';
        language = modes[lang] ? lang : 'java';
        editor.setOption('mode', modes[lang] || modes.java);
        if (editor.getValue() !== value) editor.setValue(value || '');
        editor.clearHistory();
        editor.scrollTo(0, 0);
        updateDiagnostics(); editor.refresh();
        // 值没变时不会触发 change，高度也就报不上去；这里补一次。
        post('editorChanged', { code: editor.getValue(), contentHeight: contentHeight(), documentID });
        post('editorSelection', { documentID, text: '' });
      },
      // 同一篇文档里由宿主改写（「重置为初始代码」与它的撤销）：作为一步可撤销的编辑，
      // 用户在编辑器里按 ⌘Z 也能拿回原来的代码。
      replace(value, id) {
        if (id && id !== documentID) return;
        if (editor.getValue() === value) return;
        const last = editor.lastLine();
        editor.operation(() => {
          editor.replaceRange(value || '', CodeMirror.Pos(editor.firstLine(), 0), CodeMirror.Pos(last, editor.getLine(last).length), '+reset');
        });
        editor.focus();
      },
      setValue(value, lang) { this.load(value, lang, documentID); },
      setSuggestions(list, id) { if (id && id !== documentID) return; setSuggestions(list); },
      acceptAllSuggestions() { acceptAllSuggestions(); },
      setLanguage(lang) { language = modes[lang] ? lang : 'java'; editor.setOption('mode', modes[lang] || modes.java); updateDiagnostics(); },
      applyRemoteCompletions(requestID, items) {
        if (!completionSnapshot || completionSnapshot.requestID !== requestID || completionGeneration !== requestID) return;
        const cursor = editor.getCursor();
        if (editor.getValue() !== completionSnapshot.code || cursor.line !== completionSnapshot.line || cursor.ch !== completionSnapshot.character) return;
        showCompletion(editor, Array.isArray(items) ? items : []);
      },
      format() { editor.operation(() => { for (let i = 0; i < editor.lineCount(); i++) editor.indentLine(i, 'smart'); }); editor.focus(); },
      undo() { editor.undo(); editor.focus(); },
      redo() { editor.redo(); editor.focus(); }
    };
    post('editorReady', { mode: modes[language], lineCount: editor.lineCount(), contentHeight: contentHeight() });
  })();
  </script>
</body>
</html>
